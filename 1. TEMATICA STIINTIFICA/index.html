<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tematica științifică · Titularizare Fizică</title>
<style>
  :root {
    --bg: #f4f6f5;
    --text: #17211f;
    --muted: #66736f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1716;
      --text: #edf4f2;
      --muted: #a9b8b4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 18px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main {
    max-width: 640px;
    margin: 0 auto;
  }
  .back {
    display: inline-block;
    margin-bottom: 18px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .back:hover { color: var(--text); }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(26px, 6vw, 38px);
    line-height: 1.1;
  }
  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }
  .grid {
    display: grid;
    gap: 12px;
  }
  a.btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 22px;
    border-radius: 14px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,.2);
  }
  a.btn:active {
    transform: translateY(0);
  }
  .nr {
    font-variant-numeric: tabular-nums;
    opacity: .75;
    min-width: 22px;
  }
  .b1 { background: #1f6f6b; }
  .b2 { background: #b8862e; }
  .b3 { background: #7b5fb8; }
  .b4 { background: #2f7d52; }
  .b5 { background: #b94d42; }
  .b6 { background: #d07a2f; }

  footer {
    margin-top: 36px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<main>
  <a class="back" href="../index.html">← Pagina principală</a>

  <header>
    <h1>Tematica științifică</h1>
    <p class="subtitle">Alege modulul</p>
  </header>

  <div class="grid">
    <a class="btn b1" href="1. Mecanica/index.html">
      <span class="nr">1</span><span>Mecanică</span>
    </a>
    <a class="btn b2" href="2. Termodinamica si fizica statistica/index.html">
      <span class="nr">2</span><span>Termodinamică și fizică statistică</span>
    </a>
    <a class="btn b3" href="3. Electricitate si magnetism/index.html">
      <span class="nr">3</span><span>Electricitate și magnetism</span>
    </a>
    <a class="btn b4" href="4. Optica/index.html">
      <span class="nr">4</span><span>Optică</span>
    </a>
    <a class="btn b5" href="5. Fizica atomica, nucleara si cuantica/index.html">
      <span class="nr">5</span><span>Fizică atomică, nucleară și cuantică</span>
    </a>
    <a class="btn b6" href="6. Elemente de teoria haosului/index.html">
      <span class="nr">6</span><span>Elemente de teoria haosului</span>
    </a>
  </div>

  <footer>1. Tematica științifică · Titularizare Fizică</footer>
</main>
</body>
</html>
