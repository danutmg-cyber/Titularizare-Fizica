<!DOCTYPE html>
<html lang="ro">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proiectarea didactică · Didactica fizicii · Titularizare Fizică</title>

<style>

:root {
  --bg: #f4f6f5;
  --text: #17211f;
  --muted: #66736f;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1716;
    --text: #edf4f2;
    --muted: #a9b8b4;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px 18px;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: var(--bg);
  color: var(--text);
}

main {
  max-width: 640px;
  margin: 0 auto;
}

.back {
  display: inline-block;

  margin-bottom: 18px;

  color: var(--muted);

  text-decoration: none;

  font-size: 14px;
  font-weight: 600;
}

.back:hover {
  color: var(--text);
}

header {
  text-align: center;
  margin-bottom: 32px;
}

h1 {
  margin: 0 0 6px;

  font-size: clamp(24px, 6vw, 34px);
  line-height: 1.15;
}

.subtitle {
  margin: 0;

  color: var(--muted);

  font-size: 16px;
}

.grid {
  display: grid;
  gap: 12px;
}

a.btn {
  display: flex;
  align-items: center;
  gap: 14px;

  padding: 20px 22px;

  border-radius: 14px;

  color: #ffffff;

  text-decoration: none;

  font-weight: 700;
  font-size: 17px;

  box-shadow:
    0 2px 6px rgba(0, 0, 0, .15);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

a.btn:hover {
  transform: translateY(-2px);

  box-shadow:
    0 4px 10px rgba(0, 0, 0, .2);
}

a.btn:active {
  transform: translateY(0);
}

.nr {
  min-width: 34px;

  font-variant-numeric: tabular-nums;

  opacity: .78;
}


/* Culorile temelor */

.b1 {
  background: #1f6f6b;
}

.b2 {
  background: #2f6fa8;
}


footer {
  margin-top: 36px;

  text-align: center;

  color: var(--muted);

  font-size: 13px;
}

</style>

</head>


<body>

<main>

  <a
    class="back"
    href="../index.html"
  >
    ← Didactica fizicii
  </a>


  <header>

    <h1>
      Proiectarea didactică
    </h1>

    <p class="subtitle">
      Alege tema
    </p>

  </header>


  <div class="grid">


    <!-- 1. Planificarea calendaristică -->

    <a
      class="btn b1"
      href="planificarea-calendaristica.html"
    >

      <span class="nr">
        1
      </span>

      <span>
        Planificarea calendaristică
      </span>

    </a>


    <!-- 2. Proiectarea lecțiilor -->

    <a
      class="btn b2"
      href="proiectarea-lectiilor.html"
    >

      <span class="nr">
        2
      </span>

      <span>
        Proiectarea lecțiilor
      </span>

    </a>


  </div>


  <footer>
    2. Tematica pentru didactica fizicii · Titularizare Fizică
  </footer>

</main>

</body>

</html>
